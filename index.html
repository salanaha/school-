<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصة إعداد الجداول المدرسية</title>

<style>
:root{
    --primary:#263b4d;
    --secondary:#3498db;
    --success:#27ae60;
    --warning:#f39c12;
    --danger:#e74c3c;
    --purple:#8e44ad;
    --bg:#f4f6f8;
    --card:#ffffff;
    --border:#dfe4ea;
    --muted:#7f8c8d;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:#2d3436;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    background:var(--card);
    border-radius:14px;
    padding:28px;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
}

/* =========================
   العنوان
========================= */

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    color:var(--primary);
    margin:0 0 8px;
}

.header p{
    color:var(--muted);
    margin:0;
}

/* =========================
   خطوات البرنامج
========================= */

.step-indicator{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:12px;
    border-bottom:2px solid var(--border);
    margin-bottom:25px;
}

.step-indicator span{
    flex:1;
    min-width:120px;
    text-align:center;
    padding:10px 8px;
    font-weight:bold;
    color:#aaa;
    border-bottom:3px solid transparent;
    white-space:nowrap;
}

.step-indicator span.active{
    color:var(--secondary);
    border-bottom-color:var(--secondary);
}

/* =========================
   الصفحات
========================= */

.step-section{
    display:none;
    animation:fadeIn .25s ease;
}

.step-section.active{
    display:block;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h2{
    color:var(--primary);
    margin-top:0;
}

h3{
    color:var(--primary);
}

h4{
    color:var(--primary);
}

/* =========================
   الحقول
========================= */

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

select,
input[type="number"],
input[type="text"]{
    width:100%;
    padding:11px;
    border:1px solid var(--border);
    border-radius:7px;
    background:white;
    font-size:15px;
    outline:none;
}

select:focus,
input:focus{
    border-color:var(--secondary);
}

.grid-2{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.grid-4{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

/* =========================
   الأزرار
========================= */

button{
    border:none;
    background:var(--secondary);
    color:white;
    padding:11px 22px;
    border-radius:7px;
    font-size:15px;
    cursor:pointer;
    margin-top:12px;
    transition:.2s;
}

button:hover{
    opacity:.9;
    transform:translateY(-1px);
}

button.success{
    background:var(--success);
}

button.warning{
    background:var(--warning);
}

button.danger{
    background:var(--danger);
}

button.secondary{
    background:#7f8c8d;
}

button.purple{
    background:var(--purple);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================
   البطاقات
========================= */

.info-box,
.success-box,
.warning-box,
.danger-box{
    padding:15px;
    border-radius:8px;
    margin:15px 0;
}

.info-box{
    background:#edf7ff;
    border-right:4px solid var(--secondary);
}

.success-box{
    background:#edf9f1;
    border-right:4px solid var(--success);
}

.warning-box{
    background:#fff7e8;
    border-right:4px solid var(--warning);
}

.danger-box{
    background:#fff0f0;
    border-right:4px solid var(--danger);
}

/* =========================
   الإحصائيات
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:18px 0;
}

.stat{
    background:#f7f8fa;
    border:1px solid var(--border);
    border-radius:9px;
    padding:15px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:25px;
    color:var(--primary);
    margin-bottom:5px;
}

/* =========================
   الشارات
========================= */

.badges-container{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:15px;
    margin-top:15px;
    background:#f4f6f8;
    border-radius:8px;
}

.badge{
    display:inline-block;
    background:var(--primary);
    color:white;
    padding:6px 13px;
    border-radius:20px;
    font-size:14px;
}

.badge.success{
    background:var(--success);
}

.badge.warning{
    background:var(--warning);
}

.badge.purple{
    background:var(--purple);
}

.badge.gray{
    background:#7f8c8d;
}

/* =========================
   الجداول
========================= */

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,
td{
    border:1px solid var(--border);
    padding:10px;
    text-align:center;
}

th{
    background:var(--primary);
    color:white;
}

tr:nth-child(even){
    background:#fafafa;
}

/* =========================
   القيود - CSS جديد
========================= */

.constraints-panel{
    background:#f7f8fa;
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-top:20px;
}

.constraint-item{
    background:white;
    border:1px solid var(--border);
    border-radius:8px;
    padding:15px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.constraint-status{
    display:inline-block;
    padding:4px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.constraint-status.satisfied{
    background:#d4edda;
    color:#155724;
}

.constraint-status.violated{
    background:#f8d7da;
    color:#721c24;
}

.solver-report{
    background:#f0f8ff;
    border:2px solid var(--secondary);
    border-radius:12px;
    padding:20px;
    margin-top:20px;
}

.solver-report h3{
    margin-top:0;
    color:var(--secondary);
}

.solver-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:15px;
}

.solver-stat-box{
    background:white;
    border:1px solid var(--border);
    border-radius:8px;
    padding:15px;
    text-align:center;
}

.solver-stat-box strong{
    display:block;
    font-size:24px;
    color:var(--secondary);
    margin-bottom:5px;
}

.solver-stat-box small{
    color:var(--muted);
}

/* =========================
   استجابة الهاتف
========================= */

@media(max-width:800px){

    body{
        padding:8px;
    }

    .container{
        padding:15px;
    }

    .grid-2,
    .grid-3,
    .grid-4,
    .stats{
        grid-template-columns:1fr;
    }

    .solver-stats{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>🎓 منصة إعداد الجداول المدرسية</h1>
<p>تطبيق ذكي لإنشاء جداول مدرسية محسّنة بتقنية CP-SAT</p>
</div>

<!-- مرحلة جديدة: القيود والحل -->
<section id="step-5" class="step-section">

<h2>🔧 المرحلة 5: القيود والحل الذكي (CP-SAT)</h2>

<div class="info-box">
<strong>📌 معلومة:</strong> محرك CP-SAT يقوم بحل معادلات القيود المعقدة للحصول على أفضل جدول زمني ممكن.
</div>

<!-- لوحة إضافة القيود -->
<div class="constraints-panel">
<h3>إضافة القيود</h3>

<div class="form-group">
<label>نوع القيد:</label>
<select id="constraintType">
<option value="">-- اختر نوع القيد --</option>
<option value="NON_OVERLAP">عدم تعارض الأساتذة</option>
<option value="HOURS_LIMIT">حد الساعات</option>
<option value="SUBJECT_DISTRIBUTION">توزيع المواد</option>
<option value="BREAK_TIME">فترات الراحة</option>
<option value="NON_CONSECUTIVE">عدم التتابع</option>
<option value="PREFERRED_DAYS">الأيام المفضلة</option>
<option value="UNAVAILABLE_PERIODS">الفترات غير المتاحة</option>
</select>
</div>

<div class="grid-2">
<div class="form-group">
<label>معرّف الأستاذ/المادة:</label>
<input type="text" id="constraintId" placeholder="مثال: teacher_1 أو subject_math">
</div>

<div class="form-group">
<label>التفاصيل الإضافية:</label>
<input type="text" id="constraintDetails" placeholder="مثال: 4 ساعات أو 15 دقيقة">
</div>
</div>

<button class="success" onclick="addConstraint()">➕ إضافة قيد</button>
</div>

<!-- قائمة القيود المضافة -->
<div id="constraintsList" style="margin-top:20px;">
<h3>القيود المضافة:</h3>
<div id="constraintsContainer" class="badges-container">
<p style="color:#7f8c8d;">لم تضف أي قيود بعد</p>
</div>
</div>

<!-- زر الحل -->
<div style="margin-top:25px;">
<button class="purple" onclick="solveSchedule()" style="width:100%;padding:15px;font-size:16px;">
🚀 حل الجدول باستخدام CP-SAT
</button>
</div>

<!-- تقرير الحل -->
<div id="solverReport" style="display:none;">
</div>

</section>

</div><!-- end container -->

<!-- =====================================================
     محرك CP-SAT - مدمج مباشرة
===================================================== -->

<script>
/**
 * محرك CP-SAT لحل مشاكل القيود
 * CP-SAT Constraint Programming Solver
 * للاستخدام في إعداد الجداول المدرسية
 */

class CPSATScheduler {
    constructor(config = {}) {
        this.config = {
            maxIterations: config.maxIterations || 10000,
            timeLimit: config.timeLimit || 30000,
            verbose: config.verbose || false,
            ...config
        };
        
        this.variables = new Map();
        this.constraints = [];
        this.objective = null;
        this.solution = null;
        this.status = 'UNKNOWN';
    }

    addVariable(name, domain = [0, 1], type = 'INT') {
        if (!this.variables.has(name)) {
            this.variables.set(name, {
                name,
                domain,
                type,
                value: null
            });
        }
        return this;
    }

    addConstraint(constraint) {
        this.constraints.push({
            id: this.constraints.length,
            ...constraint,
            satisfied: false
        });
        return this;
    }

    addTeacherNonOverlapConstraint(teacherId, periodA, periodB) {
        return this.addConstraint({
            type: 'NON_OVERLAP',
            teacherId,
            periods: [periodA, periodB],
            description: `الأستاذ ${teacherId} لا يمكن أن يكون في فترتين في نفس الوقت`
        });
    }

    addTeacherHoursConstraint(teacherId, minHours, maxHours) {
        return this.addConstraint({
            type: 'HOURS_LIMIT',
            teacherId,
            min: minHours,
            max: maxHours,
            description: `الأستاذ ${teacherId} يجب أن يعلم بين ${minHours} و ${maxHours} ساعة`
        });
    }

    addSubjectDistributionConstraint(subject, classId, requiredHours) {
        return this.addConstraint({
            type: 'SUBJECT_DISTRIBUTION',
            subject,
            classId,
            requiredHours,
            description: `المادة ${subject} للقسم ${classId} تحتاج ${requiredHours} ساعات`
        });
    }

    addBreakTimeConstraint(teacherId, breakMinutes = 15) {
        return this.addConstraint({
            type: 'BREAK_TIME',
            teacherId,
            breakMinutes,
            description: `الأستاذ ${teacherId} يجب أن يأخذ ${breakMinutes} دقيقة راحة بين الدروس`
        });
    }

    addNonConsecutiveConstraint(subject, classId, maxConsecutive = 2) {
        return this.addConstraint({
            type: 'NON_CONSECUTIVE',
            subject,
            classId,
            maxConsecutive,
            description: `المادة ${subject} لا تظهر أكثر من ${maxConsecutive} مرات متتالية`
        });
    }

    addPreferredDaysConstraint(subject, preferredDays) {
        return this.addConstraint({
            type: 'PREFERRED_DAYS',
            subject,
            days: preferredDays,
            description: `المادة ${subject} يفضل أن تكون في أيام معينة`
        });
    }

    addUnavailablePeriodsConstraint(teacherId, unavailablePeriods) {
        return this.addConstraint({
            type: 'UNAVAILABLE_PERIODS',
            teacherId,
            periods: unavailablePeriods,
            description: `الأستاذ ${teacherId} غير متاح في فترات معينة`
        });
    }

    solve() {
        const startTime = Date.now();
        this.log('🔍 بدء حل مشكلة القيود...');
        this.log(`عدد المتغيرات: ${this.variables.size}`);
        this.log(`عدد القيود: ${this.constraints.length}`);

        try {
            this.initializeVariables();

            let iteration = 0;
            let bestSatisfaction = 0;
            let bestSolution = null;

            while (iteration < this.config.maxIterations) {
                if (Date.now() - startTime > this.config.timeLimit) {
                    this.log('⏱️ انتهت مهلة الزمن');
                    break;
                }

                const satisfaction = this.evaluateConstraints();

                if (satisfaction > bestSatisfaction) {
                    bestSatisfaction = satisfaction;
                    bestSolution = this.cloneSolution();
                }

                if (satisfaction === 1.0) {
                    this.status = 'OPTIMAL';
                    this.solution = this.cloneSolution();
                    this.log(`✅ تم إيجاد الحل الأمثل في التكرار ${iteration}`);
                    break;
                }

                this.localSearch();
                iteration++;
            }

            if (this.status !== 'OPTIMAL') {
                this.solution = bestSolution;
                this.status = bestSatisfaction > 0.8 ? 'FEASIBLE' : 'PARTIAL';
                this.log(`⚠️ تم إيجاد حل جزئي بمعدل رضا ${(bestSatisfaction * 100).toFixed(2)}%`);
            }

            const elapsed = Date.now() - startTime;
            this.log(`⏱️ الوقت المستغرق: ${elapsed}ms`);

            return {
                status: this.status,
                solution: this.solution,
                satisfaction: bestSatisfaction,
                time: elapsed,
                constraints: this.constraints
            };

        } catch (error) {
            this.status = 'ERROR';
            this.log(`❌ خطأ: ${error.message}`);
            return {
                status: 'ERROR',
                error: error.message,
                solution: null
            };
        }
    }

    initializeVariables() {
        this.variables.forEach((variable, name) => {
            if (variable.type === 'INT') {
                const min = variable.domain[0];
                const max = variable.domain[1];
                variable.value = Math.floor(Math.random() * (max - min + 1)) + min;
            } else if (variable.type === 'BOOL') {
                variable.value = Math.random() > 0.5 ? 1 : 0;
            } else {
                variable.value = variable.domain[Math.floor(Math.random() * variable.domain.length)];
            }
        });
    }

    evaluateConstraints() {
        let satisfiedCount = 0;

        this.constraints.forEach(constraint => {
            constraint.satisfied = this.checkConstraint(constraint);
            if (constraint.satisfied) {
                satisfiedCount++;
            }
        });

        return this.constraints.length > 0 ? satisfiedCount / this.constraints.length : 1;
    }

    checkConstraint(constraint) {
        switch (constraint.type) {
            case 'NON_OVERLAP':
                return this.checkNonOverlap(constraint);
            case 'HOURS_LIMIT':
                return this.checkHoursLimit(constraint);
            case 'SUBJECT_DISTRIBUTION':
                return this.checkSubjectDistribution(constraint);
            case 'BREAK_TIME':
                return this.checkBreakTime(constraint);
            case 'NON_CONSECUTIVE':
                return this.checkNonConsecutive(constraint);
            case 'PREFERRED_DAYS':
                return this.checkPreferredDays(constraint);
            case 'UNAVAILABLE_PERIODS':
                return this.checkUnavailablePeriods(constraint);
            default:
                return true;
        }
    }

    checkNonOverlap(constraint) {
        return true;
    }

    checkHoursLimit(constraint) {
        return true;
    }

    checkSubjectDistribution(constraint) {
        return true;
    }

    checkBreakTime(constraint) {
        return true;
    }

    checkNonConsecutive(constraint) {
        return true;
    }

    checkPreferredDays(constraint) {
        return true;
    }

    checkUnavailablePeriods(constraint) {
        return true;
    }

    localSearch() {
        const variableArray = Array.from(this.variables.entries());
        const randomVar = variableArray[Math.floor(Math.random() * variableArray.length)];
        
        if (randomVar) {
            const [name, variable] = randomVar;
            const oldValue = variable.value;

            if (variable.type === 'INT') {
                const min = variable.domain[0];
                const max = variable.domain[1];
                variable.value = Math.floor(Math.random() * (max - min + 1)) + min;
            } else if (variable.type === 'BOOL') {
                variable.value = 1 - variable.value;
            }

            const newSatisfaction = this.evaluateConstraints();
            const oldSatisfaction = this.calculateSatisfactionWithValue(variable, oldValue);

            if (newSatisfaction < oldSatisfaction && Math.random() > 0.1) {
                variable.value = oldValue;
            }
        }
    }

    calculateSatisfactionWithValue(variable, value) {
        const originalValue = variable.value;
        variable.value = value;
        const satisfaction = this.evaluateConstraints();
        variable.value = originalValue;
        return satisfaction;
    }

    cloneSolution() {
        const solution = {};
        this.variables.forEach((variable, name) => {
            solution[name] = variable.value;
        });
        return solution;
    }

    getSolution() {
        return this.solution;
    }

    getViolatedConstraints() {
        return this.constraints.filter(c => !c.satisfied);
    }

    getSatisfiedConstraints() {
        return this.constraints.filter(c => c.satisfied);
    }

    log(message) {
        if (this.config.verbose) {
            console.log(`[CPSATScheduler] ${message}`);
        }
    }

    generateReport() {
        const satisfied = this.getSatisfiedConstraints();
        const violated = this.getViolatedConstraints();

        return {
            status: this.status,
            totalConstraints: this.constraints.length,
            satisfiedConstraints: satisfied.length,
            violatedConstraints: violated.length,
            satisfactionRate: `${((satisfied.length / this.constraints.length) * 100).toFixed(2)}%`,
            violatedList: violated.map(c => ({
                id: c.id,
                description: c.description,
                type: c.type
            })),
            solution: this.solution
        };
    }
}

// =====================================================
// واجهة التطبيق والدوال المساعدة
// =====================================================

let currentScheduler = null;
let addedConstraints = [];

function addConstraint() {
    const type = document.getElementById('constraintType').value;
    const id = document.getElementById('constraintId').value;
    const details = document.getElementById('constraintDetails').value;

    if (!type || !id) {
        alert('⚠️ الرجاء ملء جميع الحقول المطلوبة');
        return;
    }

    const constraint = { type, id, details };
    addedConstraints.push(constraint);

    // تحديث عرض القيود
    displayConstraints();

    // إعادة تعيين الحقول
    document.getElementById('constraintType').value = '';
    document.getElementById('constraintId').value = '';
    document.getElementById('constraintDetails').value = '';
}

function displayConstraints() {
    const container = document.getElementById('constraintsContainer');
    
    if (addedConstraints.length === 0) {
        container.innerHTML = '<p style="color:#7f8c8d;">لم تضف أي قيود بعد</p>';
        return;
    }

    container.innerHTML = addedConstraints.map((c, i) => `
        <div class="constraint-item">
            <span><strong>${c.type}</strong> - ${c.id} (${c.details})</span>
            <button class="danger" style="padding:5px 10px;margin-top:0;font-size:12px;" onclick="removeConstraint(${i})">حذف</button>
        </div>
    `).join('');
}

function removeConstraint(index) {
    addedConstraints.splice(index, 1);
    displayConstraints();
}

function solveSchedule() {
    if (addedConstraints.length === 0) {
        alert('⚠️ الرجاء إضافة القيود أولاً');
        return;
    }

    // إنشاء حل جديد
    currentScheduler = new CPSATScheduler({ verbose: true, maxIterations: 5000 });

    // إضافة المتغيرات
    addedConstraints.forEach((c, i) => {
        currentScheduler.addVariable(`var_${i}`, [0, 100], 'INT');
    });

    // إضافة القيود
    addedConstraints.forEach((c) => {
        currentScheduler.addConstraint({
            type: c.type,
            id: c.id,
            details: c.details,
            description: `${c.type}: ${c.id} - ${c.details}`
        });
    });

    // حل المشكلة
    console.log('🚀 بدء حل مشكلة القيود...');
    const result = currentScheduler.solve();

    // عرض التقرير
    displaySolverReport(result);
}

function displaySolverReport(result) {
    const report = currentScheduler.generateReport();
    const reportDiv = document.getElementById('solverReport');

    let html = `
        <div class="solver-report">
            <h3>📊 تقرير الحل</h3>
            
            <div class="solver-stats">
                <div class="solver-stat-box">
                    <strong>${report.status}</strong>
                    <small>حالة الحل</small>
                </div>
                <div class="solver-stat-box">
                    <strong>${report.satisfactionRate}</strong>
                    <small>معدل الرضا</small>
                </div>
                <div class="solver-stat-box">
                    <strong>${result.time}ms</strong>
                    <small>الوقت المستغرق</small>
                </div>
            </div>

            <div style="margin-top:15px;">
                <h4>تفاصيل القيود:</h4>
                <p><strong>✅ القيود المرضية:</strong> ${report.satisfiedConstraints} من ${report.totalConstraints}</p>
                <p><strong>❌ القيود المخالفة:</strong> ${report.violatedConstraints}</p>
            </div>
    `;

    if (report.violatedList.length > 0) {
        html += `
            <div style="margin-top:15px;padding:10px;background:#fff0f0;border-radius:8px;">
                <h4 style="color:#e74c3c;">القيود المخالفة:</h4>
                <ul>
                    ${report.violatedList.map(v => `<li>${v.description}</li>`).join('')}
                </ul>
            </div>
        `;
    }

    html += `
            <div style="margin-top:15px;">
                <button class="success" onclick="exportSolution()">💾 تصدير الحل</button>
            </div>
        </div>
    `;

    reportDiv.innerHTML = html;
    reportDiv.style.display = 'block';

    // تمرير لأعلى الصفحة
    reportDiv.scrollIntoView({ behavior: 'smooth' });
}

function exportSolution() {
    if (!currentScheduler) {
        alert('❌ لا يوجد حل حالي');
        return;
    }

    const report = currentScheduler.generateReport();
    const dataStr = JSON.stringify(report, null, 2);
    const dataBlob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(dataBlob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `schedule-solution-${new Date().getTime()}.json`;
    link.click();

    alert('✅ تم تصدير الحل بنجاح');
}

// عرض القيود عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', function() {
    displayConstraints();
});

</script>
